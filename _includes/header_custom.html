<input class="zendro-sr-only" id="zendro-theme" type="checkbox" />
    <label for="zendro-theme" class="zendro-theme-toggle" data-light="light" data-dark="dark">
        <svg id="zendro-light" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
            <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path>
        </svg>

        <svg id="zendro-dark" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path>
        </svg>
    </label>
</input>
<script>
  (function () {
    const checkbox = document.getElementById('zendro-theme');

    switch (localStorage.getItem('zendro-dark-theme')) {
    case "true":
        checkbox.checked = true;
        break;
    case "false":
        checkbox.checked = false;
        break;
    default:
        checkbox.checked = window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    document.documentElement.classList.toggle("darkmode", checkbox.checked);

    checkbox.addEventListener('change', () => {
        localStorage.setItem('zendro-dark-theme', checkbox.checked);
        document.documentElement.classList.toggle("darkmode", checkbox.checked);
    });
  })();
</script>
